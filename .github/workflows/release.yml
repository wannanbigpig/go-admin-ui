name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$package_version"
          grep -Fq "## [${package_version}]" CHANGELOG.md
          awk -v marker="## [${package_version}]" '
            index($0, marker) == 1 { found=1 }
            found && /^## \[/ && index($0, marker) != 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          {
            printf '\n## Compatibility, upgrade, and rollback\n\n'
            cat docs/compatibility.md
          } >> release-notes.md
      - run: pnpm run lint --no-cache
      - run: pnpm run type-check
      - run: pnpm run test:run
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - run: pnpm run build:production
      - name: Pack static files
        run: tar -czf "x-l-admin-vue3_${GITHUB_REF_NAME#v}.tar.gz" dist
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: x-l-admin-vue3_*.tar.gz
